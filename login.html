<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capital Treasure - Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-card">
        <!-- Logo ပုံထည့်ရန် (လိုချင်မှထည့်ပါ) -->
        <div class="icon-box">
            <img src="https://via.placeholder.com/150" alt="Logo">
        </div>
        
        <h2>Capital Treasure</h2>
        <div class="subtitle">Operations Management</div>

        <!-- Login Form -->
        <form id="loginForm">
            <div class="form-group">
                <input type="text" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input type="password" placeholder="Password" required>
            </div>

            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <!-- နှိပ်မှ ပေါ်လာမည့် Password အသစ်လဲသည့် အပိုင်း -->
        <span class="toggle-link" onclick="toggleChangePassword()">Password အသစ်လဲလှယ်ရန်</span>

        <div id="changePasswordBox" class="change-password-section">
            <h3>Password အသစ်ပြောင်းရန်</h3>
            <form>
                <div class="form-group">
                    <input type="password" placeholder="Current Password" required>
                </div>
                <div class="form-group">
                    <input type="password" placeholder="New Password" required>
                </div>
                <button type="submit" class="btn-submit" style="background-color: #2563eb; color: #ffffff;">Confirm Change</button>
            </form>
        </div>
    </div>

    <script>
        // နှိပ်လိုက်ပါက Password အသစ်လဲသည့် box ပေါ်လာ/ပျောက်သွားစေရန် JavaScript လုပ်ဆောင်ချက်
        function toggleChangePassword() {
            const box = document.getElementById('changePasswordBox');
            if (box.style.display === 'block') {
                box.style.display = 'none';
            } else {
                box.style.display = 'block';
            }
        }
    </script>

</body>
</html>
