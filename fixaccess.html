<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Assets Management - Capital Treasure</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --bg-primary: #0f172a; --bg-card: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --accent: #2563eb; --border: #e2e8f0; --radius: 12px; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8fafc; color: var(--text-main); display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background-color: var(--bg-primary); color: #fff; display: flex; flex-direction: column; position: fixed; height: 100vh; overflow-y: auto; }
        .brand { padding: 24px; display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .brand i { color: var(--accent); }
        .nav-list { list-style: none; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
        .nav-item a { width: 100%; padding: 12px 16px; border-radius: var(--radius); color: #94a3b8; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .nav-item a:hover, .nav-item.active a { background-color: rgba(255, 255, 255, 0.1); color: #fff; }
        .nav-item.active a { background-color: var(--accent); }
        .nav-divider { height: 1px; background-color: rgba(255, 255, 255, 0.1); margin: 8px 0; }
        .main-wrapper { margin-left: 260px; flex: 1; display: flex; flex-direction: column; }
        header { background-color: var(--bg-card); padding: 16px 32px; border-bottom: 1px solid var(--border); }
        .content-body { padding: 32px; }
        .form-card { background: var(--bg-card); padding: 28px; border-radius: var(--radius); border: 1px solid var(--border); max-width: 800px; margin: 0 auto; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: span 2; }
        label { font-size: 13px; font-weight: 600; color: #334155; }
        input, select { padding: 10px; border: 1px solid var(--border); border-radius: 8px; outline: none; }
        .btn-primary { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="brand"><i data-lucide="shield-check"></i><span>Capital Treasure</span></div>
        <ul class="nav-list">
            <!-- Dashboard Menu -->
            <li class="nav-item" id="menu-dashboard"><a href="dashboard.html"><i data-lucide="layout-dashboard"></i> Dashboard</a></li>

            <!-- Fleet Items -->
            <li class="nav-item" id="menu-fuel"><a href="refilling.html"><i data-lucide="fuel"></i> Fuel Refilling</a></li>
            <li class="nav-item" id="menu-maintenance"><a href="matainment.html"><i data-lucide="wrench"></i> Maintenance</a></li>
            <li class="nav-item" id="menu-inspection"><a href="Inspection.html"><i data-lucide="clipboard-check"></i> Inspection</a></li>

            <!-- Warehouse Items -->
            <li class="nav-item" id="menu-warehouse"><a href="warehouse.html"><i data-lucide="warehouse"></i> Warehouse Overview</a></li>
            <li class="nav-item" id="menu-stock"><a href="stock.html"><i data-lucide="boxes"></i> Stock In/Out</a></li>
            <li class="nav-item" id="menu-inventory"><a href="inventory.html"><i data-lucide="list-checks"></i> Inventory List</a></li>

            <!-- Admin / Stationery Items -->
            <li class="nav-item" id="menu-stationery"><a href="stationary.html"><i data-lucide="pen-tool"></i> Stationery Requests</a></li>
            <li class="nav-item active" id="menu-fixed-assets"><a href="fixaccess.html"><i data-lucide="box"></i> Fixed Assets</a></li>

            <!-- HR Items -->
            <li class="nav-item" id="menu-leave"><a href="leaves.html"><i data-lucide="calendar"></i> Leave Requests</a></li>
            <li class="nav-item" id="menu-meeting"><a href="meetingnote.html"><i data-lucide="file-text"></i> Meeting Notes</a></li>
            <li class="nav-item" id="menu-manpower"><a href="manpower.html"><i data-lucide="user-plus"></i> Manpower Plan</a></li>

            <!-- User Manage -->
            <li class="nav-item" id="menu-usermanage"><a href="usermanage.html"><i data-lucide="users"></i> User & Role Control</a></li>

            <!-- Log Out -->
            <li class="nav-divider"></li>
            <li class="nav-item"><a href="#" onclick="logout()" style="color: #ef4444;"><i data-lucide="log-out"></i> Log Out</a></li>
        </ul>
    </aside>

    <div class="main-wrapper">
        <header><h1 style="font-size: 20px;">Fixed Assets Registration</h1></header>
        <div class="content-body">
            <div class="form-card">
                <form class="form-grid" onsubmit="event.preventDefault(); alert('Asset Saved!');">
                    <div class="form-group"><label>Asset Code / Tag</label><input type="text" placeholder="e.g. AST-YGN-001" required></div>
                    <div class="form-group"><label>Asset Name</label><input type="text" placeholder="e.g. Dell Laptop / Office Desk" required></div>
                    <div class="form-group"><label>Category</label><select><option>IT Equipment</option><option>Office Furniture</option><option>Machinery</option><option>Vehicle</option></select></div>
                    <div class="form-group"><label>Assigned To / Location</label><input type="text" placeholder="Employee Name or Office Location"></div>
                    <div class="form-group"><label>Purchase Date</label><input type="date"></div>
                    <div class="form-group"><label>Status</label><select><option>Active / In Use</option><option>Under Maintenance</option><option>Disposed</option></select></div>
                    <div class="form-group full"><button class="btn-primary">Register Asset</button></div>
                </form>
            </div>
        </div>
    </div>

    <!-- Lucide Icon Initialization -->
    <script>lucide.createIcons();</script>

    <!-- External Script File -->
    <script src="script.js"></script>

</body>
</html>
