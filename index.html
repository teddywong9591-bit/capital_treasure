<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capital Treasure - Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .login-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 380px;
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
        }
        .icon-box {
            width: 52px;
            height: 52px;
            background-color: #2563eb;
            border-radius: 12px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .icon-box svg {
            width: 26px;
            height: 26px;
            fill: #ffffff;
        }
        h2 {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 4px;
        }
        .subtitle {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 24px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 18px;
            position: relative;
        }
        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            color: #1e293b;
            outline: none;
            transition: all 0.2s ease;
        }
        input:focus {
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
        }
        .toggle-password:hover {
            color: #475569;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn-submit:hover {
            background-color: #1d4ed8;
        }
        .btn-submit:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }
        .error-message {
            color: #ef4444;
            background-color: #fef2f2;
            border: 1px solid #fee2e2;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 14px;
            display: none;
        }

        /* Custom Success Modal UI */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            background: #ffffff;
            padding: 28px 24px;
            border-radius: 16px;
            text-align: center;
            width: 90%;
            max-width: 320px;
            transform: scale(0.8);
            transition: transform 0.3s ease;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .modal-overlay.active .modal-card {
            transform: scale(1);
        }
        .success-icon {
            width: 56px;
            height: 56px;
            background-color: #dcfce7;
            color: #16a34a;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
        }
        .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
        }
        .modal-desc {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 20px;
        }
        .btn-modal {
            width: 100%;
            padding: 10px;
            background-color: #16a34a;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-modal:hover {
            background-color: #15803d;
        }

        /* Hint Box for Demo Accounts */
        .demo-accounts {
            margin-top: 18px;
            padding: 10px;
            background: #f1f5f9;
            border-radius: 8px;
            font-size: 11px;
            color: #475569;
            text-align: left;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="icon-box">
            <svg viewBox="0 0 24 24">
                <path d="M19.77 7.23l.01-.01-3.72-3.72L15 4.56l2.11 2.11c-.94.36-1.61 1.26-1.61 2.33 0 1.38 1.12 2.5 2.5 2.5.36 0 .69-.08 1-.21v7.21c0 .55-.45 1-1 1s-1-.45-1-1V14c0-1.1-.9-2-2-2h-1V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2v-3h1.5c1.38 0 2.5 1.12 2.5 2.5v1.28c0 .85.54 1.62 1.36 1.9 1.13.39 2.14-.46 2.14-1.52V10.5c0-.82-.33-1.56-.88-2.11zM11 10H5V8h6v2zm0-4H5V4h6v2z"/>
            </svg>
        </div>
        
        <h2>Capital Treasure</h2>
        <p class="subtitle">Fleet & Operations Management</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <input type="text" id="username" placeholder="Enter username" required autocomplete="off">
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="Enter password" required>
                    <button type="button" class="toggle-password" id="togglePassword">
                        <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span id="btnText">Sign In</span>
            </button>
            
            <div id="errorMsg" class="error-message">Username သို့မဟုတ် Password မှားယွင်းနေပါသည်။</div>
        </form>

        <!-- Demo Accounts Hint Box -->
        <div class="demo-accounts">
            <strong>Demo Logins:</strong><br>
            • Admin (Full): <code>admin</code> / <code>admin123</code><br>
            • Fleet Mgr: <code>fleet</code> / <code>fleet123</code><br>
            • Warehouse: <code>warehouse</code> / <code>warehouse123</code><br>
            • HR Mgr: <code>hr</code> / <code>hr123</code>
        </div>
    </div>

    <!-- Custom Success Modal UI -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-card">
            <div class="success-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <div class="modal-title">Sign In အောင်မြင်ပါသည်</div>
            <div class="modal-desc" id="modalRoleText">စနစ်အတွင်းသို့ အောင်မြင်စွာ ဝင်ရောက်ပြီးပါပြီ။</div>
            <button class="btn-modal" id="modalBtn" onclick="closeModal()">ဆက်လက်လုပ်ဆောင်မည်</button>
        </div>
    </div>

    <script>
        // Password Visibility Toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.style.color = type === 'text' ? '#2563eb' : '#94a3b8';
        });

        // Account Credentials & Role Mapping
        const usersDatabase = {
            'admin': { pass: 'admin123', role: 'ADMIN', label: 'System Admin (Full Access)' },
            'fleet': { pass: 'fleet123', role: 'FLEET', label: 'Fleet Manager' },
            'warehouse': { pass: 'warehouse123', role: 'WAREHOUSE', label: 'Warehouse Manager' },
            'hr': { pass: 'hr123', role: 'HR', label: 'HR Manager' }
        };

        // Login Logic
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');

            // UI Loading State
            submitBtn.disabled = true;
            btnText.innerText = "Authenticating...";

            setTimeout(() => {
                const user = usersDatabase[username];

                if (user && user.pass === password) {
                    errorMsg.style.display = 'none';
                    
                    // Save Session & Roles (login_role နှင့် user_role နှစ်ခုလုံး သိမ်းဆည်းပေးမည်)
                    localStorage.setItem('isAuthenticated', 'true');
                    localStorage.setItem('login_role', user.role);
                    localStorage.setItem('user_role', user.role);
                    localStorage.setItem('user_name', username);

                    document.getElementById('modalRoleText').innerText = `${user.label} အဖြစ် စနစ်အတွင်းသို့ ဝင်ရောက်နေပါသည်။`;

                    // Show Custom UI Modal
                    document.getElementById('successModal').classList.add('active');
                } else {
                    errorMsg.style.display = 'block';
                }

                submitBtn.disabled = false;
                btnText.innerText = "Sign In";
            }, 600);
        });

        function closeModal() {
            document.getElementById('successModal').classList.remove('active');
            // usermanage.html သို့ တိုက်ရိုက် လမ်းကြောင်းလွှဲပါသည်
            window.location.href = 'usermanage.html';
        }
    </script>

</body>
</html>
