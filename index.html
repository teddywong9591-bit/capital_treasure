            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            color: #ffffff;
        }
        .main-card {
            background-color: #ffffff;
            color: #0f172a;
            width: 100%;
            max-width: 420px;
            padding: 32px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
        }
        .icon-box {
            width: 72px;
            height: 72px;
            background-color: #2563eb;
            border-radius: 12px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        .icon-box svg {
            width: 26px;
            height: 26px;
            fill: #ffffff;
        }
        h2 {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 4px;
        }
        .subtitle {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 24px;
        }
        .btn-navigation {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            margin-top: 12px;
            transition: background-color 0.2s;
        }
        .btn-navigation:hover {
            background-color: #1d4ed8;
        }
        /* Footer Styles */
        .powered-footer {
            margin-top: 24px;
            border-top: 1px solid #e2e8f0;
            padding-top: 16px;
        }
        .powered-right-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .social-icons-grid {
            display: flex;
            gap: 8px;
        }
        .social-icon-btn {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
            color: #475569;
            text-decoration: none;
            transition: background 0.2s;
        }
        .social-icon-btn:hover {
            background: #e2e8f0;
        }
        .powered-right {
            text-align: right;
        }
        .powered-title {
            font-size: 10px;
            color: #94a3b8;
            text-transform: uppercase;
        }
        .developer-name {
            font-size: 12px;
            font-weight: 700;
            color: #1e293b;
        }
    </style>
