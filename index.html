<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fuel Refilling Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .form-container {
      background: #ffffff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #555;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

<div class="form-container">
  <h2>Fuel Refilling Form</h2>
  <form id="fuelForm">
    <div class="form-group">
      <label for="vehicleNo">Vehicle No (ယာဉ်အမှတ်)</label>
      <input type="text" id="vehicleNo" name="vehicleNo" required placeholder="eg. 1A/1234">
    </div>

    <div class="form-group">
      <label for="driverName">Driver Name (ယာဉ်မောင်းအမည်)</label>
      <input type="text" id="driverName" name="driverName" required placeholder="Enter driver name">
    </div>

    <div class="form-group">
      <label for="fuelType">Fuel Type (စက်သုံးဆီအမျိုးအစား)</label>
      <select id="fuelType" name="fuelType" required>
        <option value="Octane 92">Octane 92</option>
        <option value="Octane 95">Octane 95</option>
        <option value="Diesel">Diesel</option>
        <option value="Premium Diesel">Premium Diesel</option>
      </select>
    </div>

    <div class="form-group">
      <label for="liters">Liters (ဒီဇယ်/ဓာတ်ဆီ လီတာ)</label>
      <input type="number" step="0.01" id="liters" name="liters" required placeholder="0.00">
    </div>

    <div class="form-group">
      <label for="amount">Total Amount (ကျသင့်ငွေ)</label>
      <input type="number" id="amount" name="amount" required placeholder="0">
    </div>

    <button type="submit" id="submitBtn">Submit Data</button>
  </form>
</div>

<script>
  // ဤနေရာတွင် သင်၏ Google Apps Script Web App URL အစစ်အမှန်ကို ထည့်ပါ
  const scriptURL = 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE'; 

  const form = document.getElementById('fuelForm');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', e => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.innerText = 'Submitting...';

    const data = {
      vehicleNo: form.vehicleNo.value,
      driverName: form.driverName.value,
      fuelType: form.fuelType.value,
      liters: form.liters.value,
      amount: form.amount.value
    };

    fetch(scriptURL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(data)
    })
    .then(() => {
      alert('Data Google Sheet ထဲသို့ အောင်မြင်စွာ ရောက်ရှိသွားပါပြီ။');
      form.reset();
      submitBtn.disabled = false;
      submitBtn.innerText = 'Submit Data';
    })
    .catch(error => {
      console.error('Error!', error.message);
      alert('Data ပို့ရာတွင် အမှားအယွင်း ရှိနေပါသည်။');
      submitBtn.disabled = false;
      submitBtn.innerText = 'Submit Data';
    });
  });
</script>

</body>
</html>
