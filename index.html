<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capital Treasure - Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #1a2332;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 380px;
            padding: 32px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        .icon-box {
            width: 48px;
            height: 48px;
            background-color: #0066ff;
            border-radius: 10px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
        }
        .icon-box svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }
        h2 {
            font-size: 20px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 4px;
        }
        .subtitle {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 24px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
            color: #334155;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #0066ff;
            background-color: #ffffff;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #0066ff;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }
        .btn-submit:hover {
            background-color: #0052cc;
        }
        .error-message {
            color: #ef4444;
            font-size: 12px;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="icon-box">
            <svg viewBox="0 0 24 24">
                <path d="M19.77 7.23l.01-.01-3.72-3.72L15 4.56l2.11 2.11c-.94.36-1.61 1.26-1.61 2.33 0 1.38 1.12 2.5 2.5 2.5.36 0 .69-.08 1-.21v7.21c0 .55-.45 1-1 1s-1-.45-1-1V14c0-1.1-.9-2-2-2h-1V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2v-3h1.5c1.38 0 2.5 1.12 2.5 2.5v1.28c0 .85.54 1.62 1.36 1.9 1.13.39 2.14-.46 2.14-1.52V10.5c0-.82-.33-1.56-.88-2.11zM11 10H5V8h6v2zm0-4H5V4h6v2z"/>
            </svg>
        </div>
        
        <h2>Capital Treasure</h2>
        <p class="subtitle">Fleet & Fuel Expense Management</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>

            <button type="submit" class="btn-submit">Sign In</button>
            <div id="errorMsg" class="error-message">Username သို့မဟုတ် Password မှားယွင်းနေပါသည်။</div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            if (username === 'admin' && password === 'admin123') {
                errorMsg.style.display = 'none';
                alert('Login အောင်မြင်ပါသည်။');
                // dashboard.html သို့ ရွှေ့လိုပါက အောက်ပါ line ကို သုံးနိုင်ပါသည်
                // window.location.href = 'dashboard.html';
            } else {
                errorMsg.style.display = 'block';
            }
        });
    </script>

</body>
</html>
