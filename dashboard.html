<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Capital Treasure</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --bg-primary: #0f172a; --bg-card: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --accent: #2563eb; --border: #e2e8f0; --radius: 12px; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8fafc; color: var(--text-main); display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background-color: var(--bg-primary); color: #fff; display: flex; flex-direction: column; position: fixed; height: 100vh; }
        .brand { padding: 24px; display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .brand i { color: var(--accent); }
        .nav-list { list-style: none; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
        .nav-item a { width: 100%; padding: 12px 16px; border-radius: var(--radius); color: #94a3b8; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .nav-item a:hover, .nav-item.active a { background-color: rgba(255, 255, 255, 0.1); color: #fff; }
        .nav-item.active a { background-color: var(--accent); }
        .main-wrapper { margin-left: 260px; flex: 1; display: flex; flex-direction: column; }
        header { background-color: var(--bg-card); padding: 16px 32px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .content-body { padding: 32px; }
        .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .stat-card { background: var(--bg-card); padding: 20px; border-radius: var(--radius); border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .stat-val { font-size: 24px; font-weight: 700; margin-top: 4px; }
        .stat-label { font-size: 13px; color: var(--text-muted); }
        .stat-icon { padding: 12px; border-radius: var(--radius); background: #eff6ff; color: var(--accent); }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="brand"><i data-lucide="shield-check"></i><span>Capital Treasure</span></div>
        <ul class="nav-list">
            <li class="nav-item active"><a href="dashboard.html"><i data-lucide="layout-dashboard"></i> Dashboard</a></li>
            <li class="nav-item"><a href="refilling.html"><i data-lucide="fuel"></i> Fuel Refilling</a></li>
            <li class="nav-item"><a href="matainment.html"><i data-lucide="wrench"></i> Maintenance</a></li>
            <li class="nav-item"><a href="Inspection.html"><i data-lucide="clipboard-check"></i> Inspection</a></li>
            <li class="nav-item"><a href="user manage.html"><i data-lucide="users"></i> User Manage</a></li>
            <li class="nav-item" style="margin-top: auto;"><a href="logout.html"><i data-lucide="log-out"></i> Log Out</a></li>
        </ul>
    </aside>
    <div class="main-wrapper">
        <header><h1 style="font-size: 20px;">Dashboard</h1></header>
        <div class="content-body">
            <div class="grid-stats">
                <div class="stat-card">
                    <div><div class="stat-label">Total Vehicles</div><div class="stat-val">42</div></div>
                    <div class="stat-icon"><i data-lucide="car"></i></div>
                </div>
                <div class="stat-card">
                    <div><div class="stat-label">Monthly Fuel (MMK)</div><div class="stat-val">12,450,000</div></div>
                    <div class="stat-icon"><i data-lucide="fuel"></i></div>
                </div>
                <div class="stat-card">
                    <div><div class="stat-label">Active Maintenances</div><div class="stat-val">5</div></div>
                    <div class="stat-icon"><i data-lucide="wrench"></i></div>
                </div>
            </div>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
