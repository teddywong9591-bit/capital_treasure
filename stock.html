<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock In / Out - Capital Treasure</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --bg-primary: #0f172a; --bg-card: #ffffff; --text-main: #0f172a; --accent: #2563eb; --border: #e2e8f0; --radius: 12px; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8fafc; color: var(--text-main); display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background-color: var(--bg-primary); color: #fff; display: flex; flex-direction: column; position: fixed; height: 100vh; }
        .brand { padding: 20px 24px; display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .brand i { color: var(--accent); }
        .nav-list { list-style: none; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
        .nav-item a { width: 100%; padding: 9px 12px; border-radius: 8px; color: #94a3b8; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .nav-item a:hover, .nav-item.active a { background-color: rgba(255, 255, 255, 0.1); color: #fff; }
        .nav-item.active a { background-color: var(--accent); }
        .main-wrapper { margin-left: 260px; flex: 1; display: flex; flex-direction: column; }
        header { background-color: var(--bg-card); padding: 16px 32px; border-bottom: 1px solid var(--border); }
        .content-body { padding: 32px; }
        .form-card { background: var(--bg-card); padding: 24px; border-radius: var(--radius); border: 1px solid var(--border); max-width: 800px; margin: 0 auto; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: span 2; }
        label { font-size: 12px; font-weight: 600; }
        input, select, textarea { padding: 10px; border: 1px solid var(--border); border-radius: 8px; outline: none; }
        .btn-primary { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="brand"><i data-lucide="shield-check"></i><span>Capital Treasure</span></div>
        <ul class="nav-list">
            <li class="nav-item"><a href="dashboard.html"><i data-lucide="layout-dashboard"></i> Dashboard</a></li>
            <li class="nav-item"><a href="warehouse.html"><i data-lucide="warehouse"></i> Warehouse Overview</a></li>
            <li class="nav-item active"><a href="stock.html"><i data-lucide="boxes"></i> Stock In/Out</a></li>
            <li class="nav-item"><a href="inventory.html"><i data-lucide="list-checks"></i> Inventory List</a></li>
            <li class="nav-item" style="margin-top: 20px;"><a href="logout.html" style="color: #ef4444;"><i data-lucide="log-out"></i> Log Out</a></li>
        </ul>
    </aside>
    <div class="main-wrapper">
        <header><h1 style="font-size: 20px;">Stock Movement (In / Out)</h1></header>
        <div class="content-body">
            <div class="form-card">
                <form class="form-grid" onsubmit="event.preventDefault(); alert('Stock Record Saved!');">
                    <div class="form-group"><label>Movement Type</label><select><option value="IN">Stock IN (ပစ္စည်းအဝင်)</option><option value="OUT">Stock OUT (ပစ္စည်းအထွက်)</option></select></div>
                    <div class="form-group"><label>Warehouse Location</label><select><option>Main Warehouse (YGN)</option><option>Mandalay Hub</option></select></div>
                    <div class="form-group"><label>Item Name / Code</label><input type="text" placeholder="e.g. Engine Oil 20L / P-001" required></div>
                    <div class="form-group"><label>Quantity</label><input type="number" min="1" placeholder="10" required></div>
                    <div class="form-group full"><label>Reference / Note</label><textarea rows="2" placeholder="PO Number or Reason..."></textarea></div>
                    <div class="form-group full"><button class="btn-primary">Save Stock Movement</button></div>
                </form>
            </div>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
