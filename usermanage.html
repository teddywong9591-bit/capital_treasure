                            <option value="Operations">Operations</option>
                            <option value="Logistics & Fleet">Logistics & Fleet</option>
                            <option value="Warehouse">Warehouse</option>
                            <option value="Human Resources">Human Resources</option>
                            <option value="IT System">IT System</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>System Role</label>
                        <select id="userRole" required>
                            <option value="ADMIN">System Admin (Full Access)</option>
                            <option value="FLEET">Fleet Manager</option>
                            <option value="WAREHOUSE">Warehouse Staff</option>
                            <option value="HR">HR Manager</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-add">+ Add User</button>
                </form>
            </div>

            <!-- User Management Table -->
            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>User Name</th>
                            <th>Department</th>
                            <th>Role Access</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <!-- Dynamic Data will render here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Default Sample Users
        const initialUsers = [
            { id: 1, name: "Admin User", dept: "IT System", role: "ADMIN", status: "Active" },
            { id: 2, name: "Kyaw Swar", dept: "Logistics & Fleet", role: "FLEET", status: "Active" },
            { id: 3, name: "Mya Mya", dept: "Warehouse", role: "WAREHOUSE", status: "Active" }
        ];

        function getUsers() {
            return JSON.parse(localStorage.getItem('app_users')) || initialUsers;
        }

        function saveUsers(users) {
            localStorage.setItem('app_users', JSON.stringify(users));
            renderUsersTable();
        }

        function renderUsersTable() {
            const users = getUsers();
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '';

            users.forEach(user => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${user.name}</strong></td>
                    <td>${user.dept}</td>
                    <td><span style="font-weight: 600; color: #2563eb;">${user.role}</span></td>
                    <td>
                        <span class="badge ${user.status === 'Active' ? 'badge-active' : 'badge-blocked'}">
                            ${user.status}
                        </span>
                    </td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-toggle" onclick="toggleStatus(${user.id})">
                                ${user.status === 'Active' ? 'Block' : 'Unblock'}
                            </button>
                            <button class="btn-delete" onclick="deleteUser(${user.id})">Delete</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function handleAddUser(e) {
            e.preventDefault();
            const name = document.getElementById('userName').value;
            const dept = document.getElementById('userDept').value;
            const role = document.getElementById('userRole').value;

            const users = getUsers();
            const newUser = {
                id: Date.now(),
                name: name,
                dept: dept,
                role: role,
                status: 'Active'
            };

            users.push(newUser);
            saveUsers(users);
            document.getElementById('addUserForm').reset();
        }

        function toggleStatus(id) {
            const users = getUsers();
            const user = users.find(u => u.id === id);
            if (user) {
                user.status = user.status === 'Active' ? 'Blocked' : 'Active';
                saveUsers(users);
            }
        }

        function deleteUser(id) {
            if (confirm("Are you sure you want to delete this user?")) {
                let users = getUsers();
                users = users.filter(u => u.id !== id);
                saveUsers(users);
            }
        }

        function applyRoleAccess(role) {
            const groups = {
                fleet: document.getElementById('group-fleet'),
                warehouse: document.getElementById('group-warehouse'),
                admin: document.getElementById('group-admin'),
                hr: document.getElementById('group-hr')
            };
            const roleDisplay = document.getElementById('role-display');

            Object.values(groups).forEach(g => { if(g) g.style.display = 'none'; });

            if (role === 'ADMIN') {
                Object.values(groups).forEach(g => { if(g) g.style.display = 'block'; });
                if(roleDisplay) roleDisplay.innerText = 'System Admin (Full)';
            } else if (role === 'FLEET') {
                if(groups.fleet) groups.fleet.style.display = 'block';
                if(roleDisplay) roleDisplay.innerText = 'Fleet Manager';
            } else if (role === 'WAREHOUSE') {
                if(groups.warehouse) groups.warehouse.style.display = 'block';
                if(roleDisplay) roleDisplay.innerText = 'Warehouse Staff';
            } else if (role === 'HR') {
                if(groups.hr) groups.hr.style.display = 'block';
                if(roleDisplay) roleDisplay.innerText = 'HR Manager';
            }
        }

        function changeRole(role) {
            const loginRole = localStorage.getItem('login_role') || 'ADMIN';
            if (loginRole !== 'ADMIN') return;

            localStorage.setItem('user_role', role);
            applyRoleAccess(role);
        }

        window.onload = function() {
            const loginRole = localStorage.getItem('login_role') || 'ADMIN';
            const currentRole = localStorage.getItem('user_role') || loginRole;
            const roleSelector = document.getElementById('roleSelector');

            if (roleSelector) {
                if (loginRole !== 'ADMIN') {
                    // Mobile Picker UI ကို တားဆီးရန် မဟုတ်ပါက Dropdown ကို လုံးဝ ပျောက်သွားအောင်လုပ်မည်
                    roleSelector.style.display = 'none';
                } else {
                    roleSelector.style.display = 'inline-block';
                    roleSelector.value = currentRole;
                }
            }

            applyRoleAccess(currentRole);
            renderUsersTable();
        };
    </script>
</body>
</html>
