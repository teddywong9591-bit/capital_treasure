<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manpower Planning - Capital Treasure</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="manpower.css">
</head>
<body>
    <aside class="sidebar">
        <div class="brand"><i data-lucide="shield-check"></i><span>Capital Treasure</span></div>
        <ul class="nav-list">
            <li class="nav-item" id="menu-dashboard"><a href="dashboard.html"><i data-lucide="layout-dashboard"></i> Dashboard</a></li>
            <li class="nav-item active" id="menu-manpower"><a href="manpower.html"><i data-lucide="user-plus"></i> Manpower Plan</a></li>
            <li class="nav-divider"></li>
            <li class="nav-item"><a href="logout.html"><i data-lucide="log-out"></i> Log Out</a></li>
        </ul>
    </aside>
    
    <div class="main-wrapper">
        <header><h1 style="font-size: 20px;">Manpower & Employee Management</h1></header>
        
        <div class="content-body">
            <!-- Manpower Registration Form -->
            <div class="form-card">
                <h2 class="section-title"><i data-lucide="file-plus"></i> Employee Information Form</h2>
                <form class="form-grid" id="manpowerForm" onsubmit="handleManpowerSubmit(event)">
                    
                    <div class="form-group">
                        <label>နာမည် (Name)</label>
                        <input type="text" id="empName" placeholder="နာမည်ထည့်ရန်" required>
                    </div>
                    <div class="form-group">
                        <label>မွေးသက္ကရာဇ် (Date of Birth)</label>
                        <input type="date" id="dob" required>
                    </div>
                    <div class="form-group">
                        <label>အလုပ်စ၀င်သည့်နေ့ (Joined Date)</label>
                        <input type="date" id="joinedDate" required>
                    </div>
                    <div class="form-group">
                        <label>မှတ်ပုံတင်နံပါတ် (NRC)</label>
                        <input type="text" id="nrc" placeholder="ဥပမာ - ၁၂/ဥကတ(နိုင်)၁၂၃၄၅၆" required>
                    </div>
                    <div class="form-group">
                        <label>အိမ်ထောင်ရှိ/မရှိ (Marital Status)</label>
                        <select id="maritalStatus" required>
                            <option value="">Select Status</option>
                            <option>Single (လူလွတ်)</option>
                            <option>Married (အိမ်ထောင်ရှိ)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Office Location</label>
                        <input type="text" id="officeLocation" placeholder="ရုံးတည်နေရာ" required>
                    </div>
                    <div class="form-group">
                        <label>ဌာန (Department)</label>
                        <select id="department" required>
                            <option value="">Select Department</option>
                            <option>Operations</option>
                            <option>Logistics</option>
                            <option>IT / Software</option>
                            <option>Finance</option>
                            <option>HR</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>ရာထူး (Position)</label>
                        <input type="text" id="position" placeholder="ဥပမာ - Senior Accountant" required>
                    </div>
                    <div class="form-group">
                        <label>ဆက်သွယ်ရန် ဖုန်းနံပါတ် (Contact Number)</label>
                        <input type="tel" id="contactNumber" placeholder="ဖုန်းနံပါတ်" required>
                    </div>
                    <div class="form-group full">
                        <label>လက်ရှိနေထိုင်ရာလိပ်စာ (Residential Address)</label>
                        <textarea id="address" rows="2" placeholder="လက်ရှိနေထိုင်ရာ လိပ်စာအပြည့်အစုံ" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>အရေးပေါ် ဆက်သွယ်ရန် ဖုန်းနံပါတ် (Emergency Contact Number)</label>
                        <input type="tel" id="emergencyContactNumber" placeholder="အရေးပေါ် ဖုန်းနံပါတ်" required>
                    </div>
                    <div class="form-group">
                        <label>အရေးပေါ်ဆက်သွယ်ရန် / တော်စပ်ပုံ (Emergency Contact / Relationship)</label>
                        <input type="text" id="emergencyRelationship" placeholder="ဥပမာ - မိခင် / ဇနီး" required>
                    </div>
                    <div class="form-group full">
                        <label>နေထိုင်မှုအခြေအနေ (Living Condition)</label>
                        <textarea id="livingCondition" rows="2" placeholder="နေထိုင်မှုအခြေအနေ ဖော်ပြရန်"></textarea>
                    </div>

                    <div class="form-group full">
                        <button class="btn-primary" type="submit" id="submitBtn">
                            <i data-lucide="send"></i> Submit Information
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="config.js"></script>
    <script>
        lucide.createIcons();

        async function handleManpowerSubmit(event) {
            event.preventDefault();

            // လက်ရှိအချိန်နှင့် ရက်စွဲကို Timestamp အနေဖြင့် အလိုအလျောက် ထည့်သွင်းရန်
            const now = new Date();
            const timestamp = now.toISOString().replace('T', ' ').substring(0, 19);

            const formData = {
                action: "manpower", // Google Apps Script ဘက်တွင် စစ်ဆေးရန် action
                timestamp: timestamp,
                name: document.getElementById('empName').value.trim(),
                dob: document.getElementById('dob').value,
                joinedDate: document.getElementById('joinedDate').value,
                nrc: document.getElementById('nrc').value.trim(),
                maritalStatus: document.getElementById('maritalStatus').value,
                officeLocation: document.getElementById('officeLocation').value.trim(),
                department: document.getElementById('department').value,
                position: document.getElementById('position').value.trim(),
                contactNumber: document.getElementById('contactNumber').value.trim(),
                address: document.getElementById('address').value.trim(),
                emergencyContactNumber: document.getElementById('emergencyContactNumber').value.trim(),
                emergencyRelationship: document.getElementById('emergencyRelationship').value.trim(),
                livingCondition: document.getElementById('livingCondition').value.trim() || '-'
            };

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerHTML = `Submitting...`;
            submitBtn.disabled = true;

            try {
                let response = await fetch(CONFIG.WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(formData)
                });
                let result = await response.json();

                if (result.status === "success") {
                    Swal.fire({
                        title: 'အောင်မြင်ပါသည်!',
                        text: 'အချက်အလက်များကို Google Sheet သို့ အောင်မြင်စွာ တင်သွင်းပြီးပါပြီ။',
                        icon: 'success',
                        confirmButtonText: 'OK'
                    }).then(() => {
                        document.getElementById('manpowerForm').reset();
                    });
                } else {
                    Swal.fire('အမှားအယွင်းရှိပါသည်', 'Error: ' + result.message, 'error');
                }
            } catch (error) {
                console.error('Error submitting form:', error);
                Swal.fire('ချိတ်ဆက်မှု မအောင်မြင်ပါ', 'Google Sheet သို့ ချိတ်ဆက်၍ မရပါ။', 'error');
            } finally {
                submitBtn.innerHTML = `<i data-lucide="send"></i> Submit Information`;
                submitBtn.disabled = false;
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
