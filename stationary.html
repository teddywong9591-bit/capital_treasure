<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stationery Requisition - Capital Treasure</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --bg-primary: #0f172a; --bg-card: #ffffff; --text-main: #0f172a; --text-muted: #64748b; --accent: #2563eb; --border: #e2e8f0; --radius: 12px; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f8fafc; color: var(--text-main); display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background-color: var(--bg-primary); color: #fff; display: flex; flex-direction: column; position: fixed; height: 100vh; overflow-y: auto; }
        .brand { padding: 24px; display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .brand i { color: var(--accent); }
        .nav-list { list-style: none; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
        .nav-item a { width: 100%; padding: 12px 16px; border-radius: var(--radius); color: #94a3b8; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .nav-item a:hover, .nav-item.active a { background-color: rgba(255, 255, 255, 0.1); color: #fff; }
        .nav-item.active a { background-color: var(--accent); }
        .nav-divider { height: 1px; background-color: rgba(255, 255, 255, 0.1); margin: 8px 0; }
        .main-wrapper { margin-left: 260px; flex: 1; display: flex; flex-direction: column; }
        header { background-color: var(--bg-card); padding: 16px 32px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .content-body { padding: 32px; }
        .form-card { background: var(--bg-card); padding: 28px; border-radius: var(--radius); border: 1px solid var(--border); max-width: 800px; margin: 0 auto; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group.full { grid-column: span 2; }
        label { font-size: 13px; font-weight: 600; color: #334155; }
        input, select, textarea { padding: 10px; border: 1px solid var(--border); border-radius: 8px; outline: none; }
        .btn-primary { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; text-decoration: none; text-align: center; margin-top: 15px; }
        .btn-secondary:hover { background: #e2e8f0; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="brand"><i data-lucide="shield-check"></i><span>Capital Treasure</span></div>
        <ul class="nav-list">
            <!-- Sidebar Navigation Links... -->
            <li class="nav-item"><a href="dashboard.html"><i data-lucide="layout-dashboard"></i> Dashboard</a></li>
            <!-- Skip other links for brevity, keeping only the relevant active one -->
            <li class="nav-item active"><a href="stationary.html"><i data-lucide="pen-tool"></i> Stationery Requests</a></li>
            <li class="nav-item"><a href="stationarytable.html"><i data-lucide="table"></i> Stationery Inventory</a></li>
        </ul>
    </aside>
    <div class="main-wrapper">
        <header>
            <h1 style="font-size: 20px;">Stationery Requisition Form</h1>
        </header>
        <div class="content-body">
            <div class="form-card">
                <form class="form-grid" onsubmit="event.preventDefault(); alert('Stationery Request Submitted!');">
                    <!-- Form Fields -->
                    <div class="form-group"><label>Employee Name / ID</label><input type="text" placeholder="e.g. Mg Mg (EMP-001)" required></div>
                    <div class="form-group"><label>Department</label><select required><option value="">Select Department</option><option>HR & Admin</option><option>Finance</option><option>Operations</option><option>IT</option></select></div>
                    
                    <!-- Added Category to be more detailed -->
                    <div class="form-group"><label>Category</label><select required><option value="">Select Category</option><option>Writing Instruments</option><option>Paper & Notebooks</option><option>Files & Folders</option><option>Printer Supplies</option></select></div>
                    
                    <div class="form-group"><label>Item Name</label><select required><option value="">Select Item</option><option>A4 Paper (Rim)</option><option>Ballpoint Pen (Box)</option><option>Sticky Notes</option><option>Printer Toner</option><option>Arch File</option></select></div>
                    <div class="form-group"><label>Quantity</label><input type="number" min="1" placeholder="1" required></div>
                    <div class="form-group"><label>Urgency Level</label><select><option>Normal</option><option>High / Urgent</option></select></div>
                    <div class="form-group full"><label>Reason / Purpose</label><textarea rows="3" placeholder="State reason for requisition..."></textarea></div>
                    
                    <div class="form-group full">
                        <button class="btn-primary" type="submit"><i data-lucide="send"></i> Submit Request</button>
                    </div>
                </form>
                
                <!-- NEW BUTTON LINKING TO TABLE PAGE -->
                <a href="stationarytable.html" class="btn-secondary">
                    <i data-lucide="list"></i> View Stationery Inventory & Usage Log
                </a>
            </div>
        </div>
    </div>
    
    <script>lucide.createIcons();</script>
</body>
</html>
